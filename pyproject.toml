[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-job-scheduler"
version = "0.4.0"
description = "Single-operator, resource-aware research DAG scheduler over SSH"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-scheduler = "research_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
